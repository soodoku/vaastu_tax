[project]
name = "vaastu-tax"
version = "0.1.0"
description = "Analyzing vaastu compliance in Indian real estate listings"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "statsmodels",
    "matplotlib",
    "scikit-learn",
    "playwright",
    "pyarrow",
    "beautifulsoup4",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
